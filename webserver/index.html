<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <link rel="stylesheet" href="output.css">
        <title>Retriever</title>
    </head>

    <body>
        
        <!-- LANDING PAGE -->
        <div id="landing" class="bg-gray-50 mx-auto max-w-sm">
            <h1>Retriever</h1>

            <form method="get" id="hugo" class="w-full max-w-sm">
                <div class="flex items-center border-b border-blue-500 py-2">
                    <input type="text" id="hugo" name="link" placeholder="Länk" class="border border-blue-200 w-full text-gray-700 mr-3 py-1 px-2 leading-tight">
                    <input type="submit" value="Kör" id="submitButton" class="flex-shrink-0 bg-blue-500 hover:bg-blue-700 border-blue-500 hover:border-blue-700 text-sm border-4 text-white py-1 px-2 rounded">
                </div>
            </form>

        </div>

        <div id="schema" class="bg-gray-50 mx-auto max-w-sm">
            <!-- DAYS -->
        </div>
    
        <!-- Day template -->
        <template id="day_card">
            <div class="my-2 shadow bg-blue-300">
            <!--<div class="my-2 bg-white shadow rounded hover:shadow-lg transition-shadow">-->
    
                <h1 id="date">DATE</h2>
                <div id="events">
                    <!-- EVENTS -->
                </div>
            </div>
        </template>
    
        <!-- Event template -->
        <template id="event_card">
            <div class="p-1 bg-white">
                <p id="time" class="font-semibold">TIME</p>
                <p id="kurs" class="text-orange-500">KURS</p>
                <p id="moment">MOMENT</p>
                <p id="location">LOCATION</p>
            </div>
        </template>
        
       <!-- <body onload="addSubmitListener()"> -->
            
        <script src="schema.js"></script>
    </body>
</html>

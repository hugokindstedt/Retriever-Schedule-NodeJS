<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <link rel="stylesheet" href="output.css">
        <link rel="icon" type="image/x-icon" href="favicon.ico">
        <title>Retriever</title>
    </head>

    <body>
        
        
        <!-- LANDING PAGE -->
        <div id="landing" class="flex flex-col h-screen justify-center">
            
            <div id="title" class="flex items-center mx-auto">
                <img src="favicon.ico" class="h-12 w-12 rounded-xl">
                <h1 class="text-4xl font-semibold ml-2">Retriever</h1>
            </div>

            <form method="get" class="mt-4 w-5/6 md:w-full mx-auto max-w-xl py-2 px-6 rounded-xl bg-gray-50 border flex focus-within:border-gray-300">
                <input type="text" name="link" placeholder="Länk" autofocus class="w-full bg-transparent focus:outline-none pr-4 border-0 focus:ring-0 px-0 py-0">
                <button type="submit" class="px-4 rounded-xl border bg-black text-white border-transparent h-10 -mr-3 font-semibold">
                    Kör
                </button>
            </form>

            <div id="instructions" class="mx-auto mt-4">
                <p>1. Sök fram ditt schema på <a class="font-semibold underline" href="https://schema.oru.se/" target="_blank">https://schema.oru.se</a></p>
                <p>2. Kopiera länken</p>
                <p>3. Klistra in länken i sökfältet och klicka på kör!</p>
            </div>

        </div>

    </body>
</html>
